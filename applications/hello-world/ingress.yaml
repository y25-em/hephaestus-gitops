apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    argocd.argoproj.io/external-link: http://avon.orb.local/hello-world
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /hello-world(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: hello-world
                port:
                  name: http
