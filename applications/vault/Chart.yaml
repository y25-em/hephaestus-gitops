apiVersion: v2
name: vault
description: HashiCorp Vault for the hephaestus lab cluster
type: application
version: 0.1.0

# Wrapping the upstream chart in a local one lets the applications/* directory
# generator in bootstrap/applicationset.yaml pick Vault up unchanged: Argo CD
# switches a path from plain manifests to Helm as soon as it finds a Chart.yaml.
dependencies:
  - name: vault
    version: 0.34.1
    repository: https://helm.releases.hashicorp.com
